# Broker Mosquitto cho hệ thống giám sát an toàn (PLAN.md bước 1.2)
# Windows: mosquitto -c mosquitto.conf -v
# Pi 5:    sudo cp mosquitto.conf /etc/mosquitto/conf.d/safety.conf && sudo systemctl restart mosquitto

listener 1883 0.0.0.0
allow_anonymous false
password_file passwd.txt

# QoS 1: bền tin khi mất Wi-Fi ngoài công trường
max_queued_messages 1000
persistence true
persistence_location ./data/
